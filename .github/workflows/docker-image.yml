name: Dnaocker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request: 
      branches: [ "main" ]
      
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'yarn'
          cache-dependecy-path: 'path/to/your/subfolder/yarn.lock'
      - name: Install Dependencies
        run: yarn install --immutable

      - name: Run Tests
        env:
          SQLITE_DB_LOCATION: ./tmp/todos/todos.db
        run: yarn tests  
  
  build:
    needs: test 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t todo_app:v$(date +%s) .
